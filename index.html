<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="ui.title"></title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="js/init.js"></script>
  </head>
  <body>
    <div class="app">
      <!-- Menu Container -->
      <section class="panel active" data-panel="panel-menu">
        <section class="active" data-panel="menu-language">
          <div class="header">
            <h4 data-i18n-auto="ui.panel-menu.language.header"></h2>
          </div>
          <div class="body row">
            <button data-lang="nl" class="btn lang-btn">Nederlands</button>
            <button data-lang="en" class="btn lang-btn ghost">English</button>
          </div>
        </section>
      </section>

      <!-- Player Container -->
      <section class="panel active" data-panel="panel-player">
        <section class="active" data-panel="player-overview" id="player-overview">
          <div class="header">
            <h4 data-i18n-auto="ui.panel-player.overview.header"></h2>
          </div>
          <div class="body row" id="panel-player.overview">
            <!-- Filled dynamically -->
          </div>
        </section>
        <section class="active" data-panel="player-setup" id="player-setup">
          <div class="header">
            <h4 data-i18n-auto="ui.panel-player.setup.header"></h2>
          </div>
          <div class="body col" id="panel-player.setup">
            <!-- Filled dynamically -->
          </div>
      </section>

      <!-- Main Container -->
      <section class="panel active" data-panel="panel-main">
        <div class="header">
          <h2 data-i18n-auto="ui.panel-main.header"></h2>
        </div>
        <div class="body col">
          <!-- Main Menu -->
          <section class="active col" data-panel="mainmenu">
            <div>
              <h4 data-i18n-auto="ui.mainmenu.welcome.title"></h4>
              <p data-i18n-auto="ui.mainmenu.welcome.content"></p>
            </div>

            <div>
              <h4 data-i18n-auto="ui.mainmenu.goal.header"></h4>
              <p data-i18n-auto="ui.mainmenu.goal.content"></p>
            </div>

            <div>
              <h4 data-i18n-auto="ui.mainmenu.game.header"></h4>
              <ul
                class="list"
                data-i18n="ui.mainmenu.game.content"
                data-i18n-target="html"
              ></ul>
            </div>

            <div>
              <h4 data-i18n-auto="ui.mainmenu.score.header"></h4>
              <ul
                class="list"
                data-i18n="ui.mainmenu.score.content"
                data-i18n-target="html"
              ></ul>
            </div>

            <div>
              <h4 data-i18n-auto="ui.mainmenu.tasks.header"></h4>
              <p data-i18n-auto="ui.mainmenu.tasks.content"></p>
            </div>

            <div>
              <h4 data-i18n-auto="ui.mainmenu.agree.header"></h4>
              <p data-i18n-auto="ui.mainmenu.agree.content"></p>
            </div>

            <div>
              <h4 data-i18n-auto="ui.mainmenu.safety.header"></h4>
              <p data-i18n-auto="ui.mainmenu.safety.content"></p>
            </div>

            <div class="sep"></div>

            <div class="row">
              <button
                class="btn"
                data-i18n-auto="ui.mainmenu.button.createGame"
              ></button>
              <button
                class="btn"
                data-i18n-auto="ui.mainmenu.button.joinGame"
              ></button>
            </div>

          </section>
        </div>
      </section>
    </div>
  </body>
</html>
