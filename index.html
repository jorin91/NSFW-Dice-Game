<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="ui.title"></title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="js/init.js"></script>
  </head>
  <body>
    <div class="app", id="app">
      
      <!-- Main Menu -->
      <section class="panel active" data-panel="panel-mainmenu">
        <div class="header col" id="panel-mainmenu.header">
          <h2 data-i18n-auto="ui.panel-mainmenu.header"></h2>
        </div>
        <div class="body col" id="panel-mainmenu.body">
          <div>
            <h4 data-i18n-auto="ui.panel-mainmenu.welcome.title"></h4>
            <p data-i18n-auto="ui.panel-mainmenu.welcome.content"></p>
          </div>

          <div>
            <h4 data-i18n-auto="ui.panel-mainmenu.goal.header"></h4>
            <p data-i18n-auto="ui.panel-mainmenu.goal.content"></p>
          </div>

          <div>
            <h4 data-i18n-auto="ui.panel-mainmenu.game.header"></h4>
            <ul
              class="list"
              data-i18n="ui.panel-mainmenu.game.content"
              data-i18n-target="html"
            ></ul>
          </div>

          <div>
            <h4 data-i18n-auto="ui.panel-mainmenu.score.header"></h4>
            <ul
              class="list"
              data-i18n="ui.panel-mainmenu.score.content"
              data-i18n-target="html"
            ></ul>
          </div>

          <div>
            <h4 data-i18n-auto="ui.panel-mainmenu.tasks.header"></h4>
            <p data-i18n-auto="ui.panel-mainmenu.tasks.content"></p>
          </div>

          <div>
            <h4 data-i18n-auto="ui.panel-mainmenu.agree.header"></h4>
            <p data-i18n-auto="ui.panel-mainmenu.agree.content"></p>
          </div>

          <div>
            <h4 data-i18n-auto="ui.panel-mainmenu.safety.header"></h4>
            <p data-i18n-auto="ui.panel-mainmenu.safety.content"></p>
          </div>
        </div>
        <div class="footer col" id="panel-mainmenu.footer">
          <div class="row">
            <button class="btn" id="panel-mainmenu.button.createGame" data-i18n-auto="ui.panel-mainmenu.button.createGame" data-panel-hide="*" data-panel-show="panel-newgame, panel-player-overview"></button>
            <button class="btn" id="panel-mainmenu.button.joinGame" data-i18n-auto="ui.panel-mainmenu.button.joinGame" data-panel-hide="*" data-panel-show="panel-joingame, panel-player-overview"></button>
          </div>
        </div>
      </section>

      <!-- New Game -->
      <section class="panel inactive" data-panel="panel-newgame" id="panel-newgame">
        <div class="header col" id="panel-newgame.header">
          <h2 data-i18n-auto="ui.panel-newgame.header"></h2>
        </div>
        <div class="body col" id="panel-newgame.body">
          <!-- Filled dynamically -->
        </div>
        <div class="footer col" id="panel-newgame.footer">
          <div class="row">
            <button class="btn" id="panel-newgame.button.return" data-i18n-auto="ui.panel-newgame.button.return" data-panel-hide="*" data-panel-show="panel-mainmenu, panel-menu-language, panel-player-overview"></button>
            <button class="btn" id="panel-newgame.button.create" data-i18n-auto="ui.panel-newgame.button.create" data-panel-hide="*" data-panel-show="panel-game"></button>
          </div> 
        </div>
      </section>

      <!-- Join Game -->
      <section class="panel inactive" data-panel="panel-joingame" id="panel-joingame">
        <div class="header col" id="panel-joingame.header">
          <h2 data-i18n-auto="ui.panel-joingame.header"></h2>
        </div>
        <div class="body col" id="panel-joingame.body">
          <!-- Filled dynamically -->
        </div>
        <div class="footer col" id="panel-joingame.footer">
          <div class="row">
            <button class="btn" id="panel-joingame.button.return" data-i18n-auto="ui.panel-joingame.button.return" data-panel-hide="*" data-panel-show="panel-mainmenu, panel-menu-language, panel-player-overview"></button>
        </div>
      </section>

      <!-- Game Panel -->
      <section class="panel inactive" data-panel="panel-game" id="panel-game">
        <div class="header col" id="panel-game.header">
          <h2 data-i18n-auto="ui.panel-game.header.loading"></h2>
          <!-- Filled dynamically -->
        </div>
        <div class="body col" id="panel-game.body.gameplayers">
          <!-- Filled dynamically -->
        </div>
        <div class="body col" id="panel-game.body.gamefield">
          <!-- Filled dynamically -->
        </div>
        <div class="body col" id="panel-game.body.gamestatus">
          <!-- Filled dynamically -->
        </div>
        <div class="footer col" id="panel-game.footer">
        </div>
      </section>
    </div>
  </body>
</html>
