<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="ui.title"></title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="js/init.js"></script>
  </head>
  <body>
    <div class="app">
      <!-- Menu Container -->
      <section class="panel active" data-panel="panel-menu">
        <section class="active" data-panel="menu-language">
          <div class="header">
            <h4 data-i18n-auto="ui.language"></h2>
          </div>
          <div class="body row">
            <button data-lang="nl" class="btn lang-btn">Nederlands</button>
            <button data-lang="en" class="btn lang-btn ghost">English</button>
          </div>
        </section>
      </section>

      <!-- Main Container -->
      <section class="panel active" data-panel="panel-main">
        <div class="header">
          <h2 data-i18n-auto="ui.main.header"></h2>
        </div>
        <div class="body col">
          <!-- Main Menu -->
           <section class="active" data-panel="mainmenu"></section>
            <div>
              <h4 data-i18n-auto="ui.mainmenu.welcome.title"></h4>
              <p class="muted" data-i18n-auto="ui.mainmenu.welcome.content"></p>
            </div>

            <div>
              <h3 data-i18n-auto="app.mainmenu.goal.header"></h3>
              <p class="muted" data-i18n-auto="app.mainmenu.goal.content"></p>
            </div>

            <div>
              <h3 data-i18n-auto="app.mainmenu.game.header"></h3>
              <ul
                class="muted list"
                data-i18n="app.mainmenu.game.content"
                data-i18n-target="html"
              ></ul>
            </div>

            <div>
              <h3 data-i18n-auto="app.mainmenu.score.header"></h3>
              <ul
                class="muted list"
                data-i18n="app.mainmenu.score.content"
                data-i18n-target="html"
              ></ul>
            </div>

            <div>
              <h3 data-i18n-auto="app.mainmenu.tasks.header"></h3>
              <p class="muted" data-i18n-auto="app.mainmenu.tasks.content"></p>
            </div>

            <div>
              <h3 data-i18n-auto="app.mainmenu.agree.header"></h3>
              <p class="muted" data-i18n-auto="app.mainmenu.agree.content"></p>
            </div>

            <div>
              <h3 data-i18n-auto="app.mainmenu.safety.header"></h3>
              <p class="muted" data-i18n-auto="app.mainmenu.safety.content"></p>
            </div>
          </section>
        </div>
      </section>
    </div>
  </body>
</html>
